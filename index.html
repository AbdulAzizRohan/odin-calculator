  <body>
    <div id="display">0</div>
    <div class="buttons">
      <button type="button" class="button" id="seven">7</button>
      <button type="button" class="button" id="eight">8</button>
      <button type="button" class="button" id="nine">9</button>
      <button type="button" class="button" id="CE">CE</button>
      <button type="button" class="button" id="AC">AC</button>
      <button type="button" class="button" id="four">4</button>
      <button type="button" class="button" id="five">5</button>
      <button type="button" class="button" id="six">6</button>
      <button type="button" class="button" id="add">
        <i class="fa-solid fa-plus"></i>
      </button>
      <button type="button" class="button" id="subtract">
        <i class="fa-solid fa-minus"></i>
      </button>
      <button type="button" class="button" id="one">1</button>
      <button type="button" class="button" id="two">2</button>
      <button type="button" class="button" id="three">3</button>
      <button type="button" class="button" id="multiply">
        <i class="fa-solid fa-xmark"></i>
      </button>
      <button type="button" class="button" id="divide">
        <i class="fa-solid fa-divide"></i>
      </button>
      <button type="button" class="button" id="zero">0</button>
      <button type="button" class="button" id="plus-minus">
        <i class="fa-solid fa-plus-minus"></i>
      </button>
      <button type="button" class="button" id="decimal">.</button>
      <button type="button" class="button" id="delete">
        <i class="fa-solid fa-delete-left"></i>
      </button>
      <button type="button" class="button" id="equal">
        <i class="fa-solid fa-equals"></i>
      </button>
    </div>
  </body>
</html>
